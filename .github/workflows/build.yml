name: build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ['**']
    tags: ['v*']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Instaladores só em tags (v*) ou quando disparado à mão.
  package:
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win nsis --x64
            files: dist/*.exe
          - os: macos-latest
            target: --mac dmg
            files: dist/*.dmg
          - os: ubuntu-latest
            target: --linux AppImage
            files: dist/*.AppImage
    runs-on: ${{ matrix.os }}
    env:
      # Sem certificado: instaladores não assinados (o macOS pede "Abrir mesmo assim").
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      MAIN_VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      MAIN_VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      MAIN_VITE_SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run icons
      - run: npm run build
      - run: npx electron-builder ${{ matrix.target }} --publish never
      # Teste de fumaça: o app empacotado abre e renderiza a janela.
      - name: Teste de fumaça
        if: runner.os != 'Linux'
        run: node scripts/smoke.mjs dist
      - name: Teste de fumaça (Linux, tela virtual)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke.mjs dist
      - uses: actions/upload-artifact@v4
        with:
          name: pipo-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
